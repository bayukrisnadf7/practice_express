openapi: 3.0.3

info:
  title: Practice Express API
  description: REST API documentation for Practice Express
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1

        nama:
          type: string
          example: Bayu Krisna

        email:
          type: string
          format: email
          example: bayu@example.com

        no_hp:
          type: string
          example: "081234567890"

        jenis_kelamin:
          type: string
          example: L

        role:
          type: string
          example: user

    CreateUser:
      type: object
      required:
        - nama
        - email
        - password

      properties:
        nama:
          type: string
          example: Bayu Krisna

        email:
          type: string
          format: email
          example: bayu@example.com

        password:
          type: string
          format: password
          example: password123

        no_hp:
          type: string
          example: "081234567890"

        jenis_kelamin:
          type: string
          example: L

        role:
          type: string
          example: user

    LoginUser:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: bayu@example.com
        password:
          type: string
          format: password
          example: password123

paths:
  /: 
    get:
      tags:
        - Health
      summary: Health check
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                example:
                  message: "Practice Express API is running"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUser"
      responses:
        "200":
          description: Login successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Login berhasil
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          user_id:
                            type: integer
                            example: 1
                          email:
                            type: string
                            example: bayu@example.com
                          role:
                            type: string
                            example: user
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Validation error
        "401":
          description: Email atau password salah
        "500":
          description: Internal server error

  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
        "500":
          description: Internal server error

  /api/users:
    get:
      tags:
        - Users

      summary: Get all users

      responses:
        "200":
          description: Successfully get all users

          content:
            application/json:
              schema:
                type: array

                items:
                  $ref: "#/components/schemas/User"

        "500":
          description: Internal server error

    post:
      tags:
        - Users

      summary: Create a new user

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"

      responses:
        "201":
          description: User successfully created

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "400":
          description: Validation error

        "500":
          description: Internal server error

  /api/users/{id}:
    get:
      tags:
        - Users

      summary: Get user by ID

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: integer

          example: 1

      responses:
        "200":
          description: Successfully get user

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "404":
          description: User not found

    put:
      tags:
        - Users

      summary: Update user

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: integer

          example: 1

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"

      responses:
        "200":
          description: User successfully updated

        "400":
          description: Validation error

        "404":
          description: User not found

    delete:
      tags:
        - Users

      summary: Delete user

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: integer

          example: 1

      responses:
        "200":
          description: User successfully deleted

        "404":
          description: User not found
